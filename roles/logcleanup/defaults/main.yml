---
# defaults file for roles/logcleanup

logcleanup_script_path: "/usr/local/bin/logcleanup.sh"

# Each job: name, dir, pattern, retention_days (required); minute, hour (optional)
logcleanup_jobs:
  - name: myapp
    dir: /var/log/myapp
    pattern: "*.log"
    retention_days: 7
