---
- name: Ensure job directories exist
  ansible.builtin.file:
    path: "{{ item.dir }}"
    state: directory
    mode: "0755"
  loop: "{{ logcleanup_jobs }}"
  loop_control:
    label: "{{ item.name }}"

- name: Deploy logcleanup script
  ansible.builtin.copy:
    src: logcleanup.sh
    dest: "{{ logcleanup_script_path }}"
    owner: root
    group: root
    mode: "0755"
  notify: Audit logcleanup script change to syslog
  tags:
    - script

- name: Remove legacy single-job cron entry
  ansible.builtin.cron:
    name: log cleanup
    cron_file: logcleanup
    user: root
    state: absent
  tags:
    - cron

- name: Ensure cleanup jobs are scheduled
  ansible.builtin.cron:
    name: "logcleanup {{ item.name }}"
    cron_file: logcleanup
    user: root
    minute: "{{ item.minute | default('30') }}"
    hour: "{{ item.hour | default('2') }}"
    job: >-
      {{ logcleanup_script_path }}
      {{ item.dir | quote }} {{ item.pattern | quote }} {{ item.retention_days }}
  loop: "{{ logcleanup_jobs }}"
  loop_control:
    label: "{{ item.name }}"
  tags:
    - cron
