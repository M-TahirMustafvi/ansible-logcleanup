---
- name: Logcleanup Playbook
  hosts: all
  become: true
  vars:
    logcleanup_log_dir: "/var/log/myapp"
    logcleanup_retention_days: "7"
    logcleanup_file_suffix: "*.log"
    logcleanup_script_path: "/usr/local/bin/logcleanup.sh"
    logcleanup_minute: "30"
    logcleanup_hour: "2"

  
  tasks:
    - name: Ensure log Directory exists
      ansible.builtin.file:
        path: "{{ logcleanup_log_dir }}"
        state: directory
        mode: "0755"
    - name: Deploy logcleanup script
      ansible.builtin.template:
        src: logcleanup.sh.j2
        dest: "{{ logcleanup_script_path }}"
        owner: root
        group: root
        mode: "0755"
        validate: bash -n %s
    - name: Setup cleanup cron
      ansible.builtin.cron:
        name: log cleanup
        cron_file: logcleanup
        user: root
        minute: "{{ logcleanup_minute }}"
        hour: "{{ logcleanup_hour }}"
        job: "{{ logcleanup_script_path }}"

